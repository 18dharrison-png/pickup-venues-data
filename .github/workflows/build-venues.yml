name: Build venue map

on:
  workflow_dispatch:
    inputs:
      states:
        description: 'States to build: "california", "all", or a list like "texas, new-york"'
        required: true
        default: california
  schedule:
    # Monthly refresh of every state (3rd of the month, 09:17 UTC).
    - cron: "17 9 3 * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-venues
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      states: ${{ steps.pick.outputs.states }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        env:
          REQUESTED: ${{ github.event.inputs.states || 'all' }}
        run: python3 scripts/pick_states.py "$REQUESTED" >> "$GITHUB_OUTPUT"

  state:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        state: ${{ fromJson(needs.plan.outputs.states) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
          pip install --quiet "osmium>=4,<5"

      - name: Download ${{ matrix.state }} from Geofabrik
        run: |
          curl -fsSL --retry 5 --retry-delay 30 -o in.osm.pbf \
            "https://download.geofabrik.de/north-america/us/${{ matrix.state }}-latest.osm.pbf"
          ls -lh in.osm.pbf

      - name: Keep only parks, courts and fields
        run: |
          osmium tags-filter in.osm.pbf \
            nwr/leisure=pitch,sports_centre,track,fitness_station,park,golf_course \
               nwr/amenity=school,college,university,kindergarten,prison,place_of_worship \
                  nwr/club \
            -o filtered.osm.pbf
          rm in.osm.pbf
          ls -lh filtered.osm.pbf

      - name: Build venues
        run: |
          mkdir -p out
          python scripts/build_state.py filtered.osm.pbf "out/${{ matrix.state }}.ndjson.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: state-${{ matrix.state }}
          path: out/
          retention-days: 3

  publish:
    needs: [plan, state]
    # Publish whatever states succeeded, even if a few failed.
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          pattern: state-*
          merge-multiple: true
          path: incoming/

      - name: Merge with states built in earlier runs
        run: |
          mkdir -p store/states
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth 1 origin data
            git archive FETCH_HEAD states | tar -x -C store
          fi
          cp incoming/*.ndjson.gz store/states/ 2>/dev/null || true
          ls -lh store/states

      - name: Save state data to the "data" branch
        run: |
          cd store
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add states
          git commit -q -m "Venue data built $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build map files
        run: python scripts/build_site.py store/states site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
